<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus pedidos - Trattoria Venezia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="carrinho.css">
    <link rel="stylesheet" href="address.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .orders-page {
            min-height: 70vh;
            background-color: var(--bg-light-gray);
            padding: 40px 20px;
        }
        .orders-container {
            max-width: 820px;
            margin: 0 auto;
        }
        .orders-title {
            font-family: 'Outfit', sans-serif;
            color: var(--primary-wine);
            font-size: 2rem;
            margin-bottom: 24px;
        }
        .orders-empty {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 24px;
            text-align: center;
            color: var(--text-muted);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.05rem;
        }
        .order-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 22px;
            margin-bottom: 18px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
        }
        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .order-card-header strong {
            font-family: 'Outfit', sans-serif;
            color: var(--primary-wine);
            font-size: 1.05rem;
        }
        .order-card-header span {
            color: var(--text-muted);
            font-size: 0.88rem;
        }
        .order-status {
            background: var(--bg-light-gray);
            color: var(--text-dark);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .order-items {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .order-items th,
        .order-items td {
            padding: 8px 4px;
            text-align: left;
            border-bottom: 1px dashed var(--border-color);
        }
        .order-items th:last-child,
        .order-items td:last-child {
            text-align: right;
        }
        .order-total {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .orders-back {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary-wine);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="dark-mode.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="header-logo">
                <a href="index.html">
                    <img src="logo-delivery.png" alt="Trattoria Venezia">
                </a>
            </div>

            <nav class="header-nav">
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="index.html#cardapio" class="nav-link">Card&aacute;pio</a></li>
                    <li><a href="meus-pedidos.html" class="nav-link active">Meus Pedidos</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <div class="user-account-wrapper">
                    <button class="header-btn" id="userMenuBtn"></button>
                </div>

                <a href="carrinho.html" class="header-btn cart-btn" style="text-decoration: none;">
                    <div class="cart-info">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span class="cart-total" id="headerCartTotal">R$ 0,00</span>
                        <span class="cart-badge" id="cartBadge">0</span>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <main class="orders-page">
        <div class="orders-container">
            <h1 class="orders-title">Meus pedidos</h1>
            <div id="ordersList"></div>
            <a href="index.html" class="orders-back"><i class="fa-solid fa-arrow-left"></i> Fazer mais pedidos</a>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="user.js"></script>
    <script src="meus-pedidos.js"></script>
    <script src="dark-mode.js"></script>
</body>
</html>
